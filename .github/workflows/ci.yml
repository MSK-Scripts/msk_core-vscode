name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node --check extension.js
          node --check uninstall.js

      - name: Package
        run: npx --yes @vscode/vsce package --out msk-core-lua.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: msk-core-lua-vsix
          path: msk-core-lua.vsix
